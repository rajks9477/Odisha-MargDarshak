services:
  # 1. FastAPI Backend Web Service
  - type: web
    name: odisha-margdarshak-backend
    runtime: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PROJECT_NAME
        value: "Odisha MargDarshak Intelligence Platform"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: "sqlite+aiosqlite:///./odisha_margdarshak.db"
      - key: BACKEND_CORS_ORIGINS
        value: '["*"]'
    autoDeploy: true

  # 2. Next.js Frontend Web Service
  - type: web
    name: odisha-margdarshak-frontend
    runtime: node
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    startCommand: "npm start"
    envVars:
      - key: NODE_ENV
        value: "production"
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: odisha-margdarshak-backend
          property: url
    autoDeploy: true
