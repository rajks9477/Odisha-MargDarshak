version: '3.8'

services:
  # 1. PostGIS Database
  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: nermargdarshak_prod_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-nermargdarshak}
    volumes:
      - postgis_prod_data:/var/lib/postgresql/data
      - ./backend/scripts/init_backup.sql:/docker-entrypoint-initdb.d/init_backup.sql:ro
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nermargdarshak"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Redis Message Bus
  redis:
    image: redis:7-alpine
    container_name: nermargdarshak_prod_redis
    volumes:
      - redis_prod_data:/data
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nermargdarshak_prod_backend
    environment:
      PROJECT_NAME: "NER-MargDarshak Intelligence Platform"
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-nermargdarshak}"
      REDIS_URL: "redis://redis:6379/0"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-ner_margdarshak_super_secret_jwt_key_2026}
      BACKEND_CORS_ORIGINS: '["http://localhost:3000","https://nermargdarshak.gov.in"]'
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"

  # 4. Next.js Web Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nermargdarshak_prod_frontend
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:8000/api/v1"
      NEXT_PUBLIC_WS_URL: "ws://localhost:8000/api/v1/ws"
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  postgis_prod_data:
  redis_prod_data:
