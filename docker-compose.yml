version: '3.8'

services:
  # 1. PostGIS Database
  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: nermargdarshak_postgis
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-nermargdarshak}
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nermargdarshak"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Redis Event & WebSocket Broadcast Bus
  redis:
    image: redis:7-alpine
    container_name: nermargdarshak_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. FastAPI AI & Spatial Intelligence Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nermargdarshak_backend
    environment:
      PROJECT_NAME: "Odisha MargDarshak Intelligence Platform"
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-nermargdarshak}"
      REDIS_URL: "redis://redis:6379/0"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-odisha_margdarshak_super_secret_jwt_key_2026}
      BACKEND_CORS_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000","https://nermargdarshak.gov.in"]'
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # 4. Next.js Web Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nermargdarshak_frontend
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:8000/api/v1"
      NEXT_PUBLIC_WS_URL: "ws://localhost:8000/api/v1/ws"
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgis_data:
  redis_data:
